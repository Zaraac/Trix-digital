<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Modelo de sistema de agendamento</title>
  <desc id="desc">Agenda semanal escura com horários e compromissos organizados</desc>
  <rect width="1200" height="700" fill="#111823"/>
  <rect x="100" y="70" width="1000" height="560" rx="4" fill="#0a0e14" stroke="#6b7c93"/>
  <path d="M100 145h1000" stroke="#2a3647"/>
  <text x="145" y="115" fill="#e8eef5" font-family="Arial, sans-serif" font-size="24" font-weight="700">Sua agenda</text>
  <text x="910" y="112" fill="#22d3ee" font-family="monospace" font-size="13">MODELO / SEMANA 01</text>
  <text x="145" y="205" fill="#9aa8bb" font-family="monospace" font-size="14">09:00</text>
  <rect x="265" y="175" width="720" height="58" rx="3" fill="#182231" stroke="#2a3647"/>
  <rect x="265" y="175" width="6" height="58" fill="#22d3ee"/>
  <text x="300" y="211" fill="#e8eef5" font-family="Arial, sans-serif" font-size="17">Reunião de projeto</text>
  <text x="145" y="305" fill="#9aa8bb" font-family="monospace" font-size="14">11:00</text>
  <rect x="265" y="275" width="520" height="58" rx="3" fill="#182231" stroke="#2a3647"/>
  <rect x="265" y="275" width="6" height="58" fill="#a3e635"/>
  <text x="300" y="311" fill="#e8eef5" font-family="Arial, sans-serif" font-size="17">Atendimento</text>
  <text x="145" y="405" fill="#9aa8bb" font-family="monospace" font-size="14">14:00</text>
  <rect x="265" y="375" width="650" height="58" rx="3" fill="none" stroke="#22d3ee" stroke-dasharray="8 8"/>
  <text x="300" y="411" fill="#22d3ee" font-family="Arial, sans-serif" font-size="17">Horário disponível</text>
  <text x="145" y="505" fill="#9aa8bb" font-family="monospace" font-size="14">16:00</text>
  <rect x="265" y="475" width="380" height="58" rx="3" fill="#182231" stroke="#2a3647"/>
  <text x="300" y="511" fill="#e8eef5" font-family="Arial, sans-serif" font-size="17">Retorno ao cliente</text>
  <text x="145" y="585" fill="#9aa8bb" font-family="monospace" font-size="12">COMPROMISSOS E DADOS ILUSTRATIVOS</text>
</svg>
